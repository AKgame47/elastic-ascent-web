<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#dfccab"><title>Elastic Ascent</title><link rel="icon" href="7-index.icon.png"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dfccab;color:#2e3028;font-family:Georgia,serif;overscroll-behavior:none}body{display:flex;justify-content:center;align-items:center}#canvas{display:block;width:min(100vw,56.25dvh);height:min(177.7778vw,100dvh);outline:none;touch-action:none}#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#dfccab;z-index:2;padding:25px}.card{width:min(100%,380px);border:1px solid #8b765f;background:#f4e9d4;padding:28px 26px;position:relative;box-shadow:5px 6px 0 #8b765f44}.eyebrow{font:10px Arial,sans-serif;letter-spacing:2.5px;display:flex;justify-content:space-between;border-bottom:1px solid #8b765f;padding-bottom:14px;color:#62533e}h1{font-weight:normal;font-size:46px;line-height:.98;letter-spacing:-2px;margin:30px 0 9px}h1 span{color:#31493f}p{font:13px/1.6 Arial,sans-serif;color:#62533e}.illustration{display:block;width:100%;height:160px;margin:12px 0}.foot{font:10px/1.5 Arial,sans-serif;text-transform:uppercase;letter-spacing:1px;margin-top:22px;border-top:1px solid #8b765f;padding-top:14px}.progress-head{display:flex;justify-content:space-between;font:11px Arial,sans-serif;margin-bottom:10px}progress{display:block;width:100%;height:8px;border:0;appearance:none;background:#dfccab}progress::-webkit-progress-bar{background:#dfccab}progress::-webkit-progress-value{background:#31493f;transition:width .15s}#retry{margin-top:18px;background:#31493f;border:0;padding:13px 20px;color:#f4e9d4;font:13px Arial,sans-serif;display:none;cursor:pointer}.small{font-size:11px;margin-bottom:0}
</style></head><body><canvas id="canvas" width="540" height="960" tabindex="0" aria-label="Elastic Ascent. Pull down and release to launch up.">Your browser needs WebGL 2 to play.</canvas>
<div id="loading"><main class="card"><div class="eyebrow"><span>AK GAMES</span><span>NO. 01 / CLAY</span></div><h1>Elastic<br><span>Ascent.</span></h1><p>A little tension. A little higher.</p>
<svg class="illustration" viewBox="0 0 300 160" aria-hidden="true"><path d="M20 132H280" stroke="#dfccab" stroke-width="2"/><path d="M70 21V39a14 14 0 1 1-14 14" fill="none" stroke="#945515" stroke-width="7" stroke-linecap="round"/><rect x="58" y="9" width="24" height="10" rx="2" fill="#2e3028"/><path d="M70 65V85" stroke="#945515" stroke-width="3"/><rect x="54" y="75" width="32" height="47" rx="16" fill="none" stroke="#31493f" stroke-width="6"/><circle cx="64" cy="86" r="2" fill="#2e3028"/><circle cx="76" cy="86" r="2" fill="#2e3028"/><path d="M118 107Q167 24 239 40" fill="none" stroke="#8b765f" stroke-width="2" stroke-dasharray="3 9"/><path d="M228 32L241 40L228 49" fill="none" stroke="#31493f" stroke-width="3" stroke-linecap="round"/><path d="M234 67V85a14 14 0 1 1-14 14" fill="none" stroke="#945515" stroke-width="7" stroke-linecap="round"/><rect x="222" y="55" width="24" height="10" rx="2" fill="#2e3028"/></svg>
<div class="progress-head"><span id="status">Unpacking the workshop</span><span id="percent">0%</span></div><progress id="progress" max="100" value="0"></progress><p class="small">About 9 MB on your first visit.</p><div class="foot">Catch a hook. Pull down. Let go.<br>Keep clear of the blades.</div><button id="retry" onclick="location.reload()">Try loading again</button></main></div>
<script>
const canvas=document.getElementById('canvas');
function fitCanvas(){const box=canvas.getBoundingClientRect();const ratio=window.devicePixelRatio||1;const w=Math.round(box.width*ratio),h=Math.round(box.height*ratio);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}}
fitCanvas();new ResizeObserver(fitCanvas).observe(canvas);window.addEventListener('resize',fitCanvas);if(window.visualViewport)window.visualViewport.addEventListener('resize',fitCanvas);
</script><script src="2-index.js"></script><script>
const statusNode=document.getElementById('status');
const engine=new Engine({canvas,canvasResizePolicy:0,executable:'3-index',mainPack:'1-hd.pck',focusCanvas:false,ensureCrossOriginIsolationHeaders:false,emscriptenPoolSize:0,godotPoolSize:0,onProgress:(current,total)=>{if(total>0){const pct=Math.min(99,Math.floor(current/total*100));document.getElementById('progress').value=pct;document.getElementById('percent').textContent=pct+'%';statusNode.textContent=pct>96?'Setting the hooks':'Unpacking the workshop';}}});
const originalModuleConfig=engine.config.getModuleConfig.bind(engine.config);
engine.config.getModuleConfig=(loadPath,response)=>{const config=originalModuleConfig(loadPath,response);const originalLocate=config.locateFile;config.locateFile=path=>path.endsWith('.audio.position.worklet.js')?'6-index.audio.position.worklet.js':path.endsWith('.audio.worklet.js')?'5-index.audio.worklet.js':originalLocate(path);return config;};
engine.startGame().then(()=>{fitCanvas();document.getElementById('loading').remove();canvas.focus({preventScroll:true});}).catch(error=>{statusNode.textContent='Could not load. Open in Chrome and retry.';document.getElementById('retry').style.display='block';console.error(error);});
document.addEventListener('contextmenu',e=>e.preventDefault());
</script></body></html>
